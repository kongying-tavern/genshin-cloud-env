# help
[tasks.help]
script = '''
#!@duckscript
!include_files  ./helpers/env.ds ./helpers/help.ds
prepare_envvars

## Start script
banner = readfile ./assets/banner.txt
echo ${banner}

# Generate commands
cmds = get_help_commands

env_file = get_env ENV_FILE
echo Current env file:
println -c magenta " ${env_file}"

echo Available commands:
print_help_commands ${cmds}
release ${cmds}

echo What do you want? >>>
cmd_name = read
exec cargo make ${cmd_name}
'''
