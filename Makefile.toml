[tasks.default]
alias = "help"

## Sub-commands
# dataenv: provide data environments
[tasks.dataenv] # !! startup data environments
script = '''
#!@duckscript
!include_files ./helpers/env.ds ./helpers/docker.ds
prepare_envvars
check_env

ENV_FILE = get_env ENV_FILE
PROJECT_NAME = get_env PROJECT_NAME

docker_down "${ENV_FILE}" "${PROJECT_NAME}" "./services/dataenv/compose.yaml"
docker_up "${ENV_FILE}" "${PROJECT_NAME}" "./services/dataenv/compose.yaml"
'''

# api: service api
[tasks.api] # !! build & daemon api
dependencies = [
    { name = "api-build" },
    { name = "api-run" }
]

[tasks.api-build] # >!! build api
script = '''
#!@duckscript
!include_files ./helpers/env.ds ./helpers/docker.ds
prepare_envvars
check_env

ENV_FILE = get_env ENV_FILE
PROJECT_NAME = get_env PROJECT_NAME

replace_env_values_in_file ${ENV_FILE} ./services/api/templates/application-datasource.yml ./services/api/.tmp/application-datasource.yml
replace_env_values_in_file ${ENV_FILE} ./services/api/templates/application-image.yml ./services/api/.tmp/application-image.yml
replace_env_values_in_file ${ENV_FILE} ./services/api/templates/application-websocket.yml ./services/api/.tmp/application-websocket.yml
replace_env_values_in_file ${ENV_FILE} ./services/api/templates/application-oauth.yml ./services/api/.tmp/application-oauth.yml
replace_env_values_in_file ${ENV_FILE} ./services/api/templates/application-nacos.yml ./services/api/.tmp/application-nacos.yml

docker_build "${ENV_FILE}" "${PROJECT_NAME}" "./services/api/compose.yaml"
'''

[tasks.api-run] # >!! start api
script = '''
#!@duckscript
!include_files ./helpers/env.ds ./helpers/docker.ds
prepare_envvars
check_env

ENV_FILE = get_env ENV_FILE
PROJECT_NAME = get_env PROJECT_NAME

docker_down "${ENV_FILE}" "${PROJECT_NAME}" "./services/api/compose.yaml"
docker_up "${ENV_FILE}" "${PROJECT_NAME}" "./services/api/compose.yaml"
'''

